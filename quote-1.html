<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; padding: 12px; }
  .stamp-outer { position: relative; background: #ffffff; padding: 12px; border-radius: 4px; width: 100%; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.10)); }
  .stamp-outer::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 50% 0%, #f5f5f5 7px, transparent 7px),
      radial-gradient(circle at 50% 100%, #f5f5f5 7px, transparent 7px),
      radial-gradient(circle at 0% 50%, #f5f5f5 7px, transparent 7px),
      radial-gradient(circle at 100% 50%, #f5f5f5 7px, transparent 7px);
    background-size: 18px 18px, 18px 18px, 18px 18px, 18px 18px;
    background-repeat: repeat-x, repeat-x, repeat-y, repeat-y;
    background-position: 0 0, 0 100%, 0 0, 100% 0;
    pointer-events: none;
    z-index: 2;
  }
  .stamp-inner { background: #fdf0ea; border-radius: 2px; padding: 24px 28px 20px; position: relative; z-index: 1; }
  .stamp-qmark { font-size: 56px; line-height: 1; color: #c8714c; font-family: Georgia, serif; opacity: 0.2; position: absolute; top: 6px; right: 16px; }
  .stamp-text { font-family: 'Bad Script', cursive; font-size: 18px; line-height: 1.8; color: #4a1f0e; text-align: left; margin: 0 0 16px; }
  .stamp-footer { display: flex; align-items: center; gap: 10px; }
  .stamp-line { flex: 1; height: 1px; background: #f0c4a8; }
  .stamp-attr { font-size: 11px; font-weight: 700; color: #c8714c; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; font-family: -apple-system, 'Segoe UI', sans-serif; }
</style>
</head>
<body>
<div class="stamp-outer">
  <div class="stamp-inner">
    <div class="stamp-qmark">"</div>
    <p class="stamp-text">The goal is simple: to create a predictable, reliable standard of comfort and pain management for every child, in every setting, every time.</p>
    <div class="stamp-footer">
      <div class="stamp-line"></div>
      <span class="stamp-attr">Physician</span>
      <div class="stamp-line"></div>
    </div>
  </div>
</div>
</body>
</html>
